# User-editable native Codex model choices and context thresholds.
schema_version = 1
# Compatibility field. Native Workflow does not pin chats.
pin_threads = true

[context]
# Coordinator: at or above; workers: strictly above. Percent of context window.
coordinator_percent = 40
worker_percent = 60

[execute.ultra_low]
model = "gpt-6-luna"
reasoning = "medium"

[review.ultra_low]
model = "gpt-6.1-sol"
reasoning = "low"

[execute.low]
model = "gpt-6-luna"
reasoning = "high"

[review.low]
model = "gpt-6.1-sol"
reasoning = "medium"

[execute.medium]
model = "gpt-6.1-sol"
reasoning = "medium"

[review.medium]
model = "gpt-6-astra"
reasoning = "medium"

[execute.high]
model = "gpt-6.1-sol"
reasoning = "high"

[review.high]
model = "gpt-6-astra"
reasoning = "high"

[execute.ultra_high]
model = "gpt-6.1-sol"
reasoning = "xhigh"

[review.ultra_high]
model = "gpt-6-astra"
reasoning = "xhigh"
