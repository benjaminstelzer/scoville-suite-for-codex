# Bundled defaults; override workflow settings in project .scoville/config.json.
schema_version = 1
# Legacy compatibility field; native Workflow never changes sidebar pinning.
pin_threads = true

[manager]
model = "gpt-6.1-sol"
reasoning = "medium"

[context]
# Manager: at or above; all children (workers, reviewers, repairs): strictly above.
# Percent of the launched model's context window.
coordinator_percent = 40
worker_percent = 60

[execute.ultra_low]
model = "gpt-6-luna"
reasoning = "medium"

[review.ultra_low]
model = "gpt-6.1-sol"
reasoning = "low"

[execute.low]
model = "gpt-6-luna"
reasoning = "high"

[review.low]
model = "gpt-6.1-sol"
reasoning = "medium"

[execute.medium]
model = "gpt-6.1-sol"
reasoning = "medium"

[review.medium]
model = "gpt-6-astra"
reasoning = "medium"

[execute.high]
model = "gpt-6.1-sol"
reasoning = "high"

[review.high]
model = "gpt-6-astra"
reasoning = "high"

[execute.ultra_high]
model = "gpt-6.1-sol"
reasoning = "xhigh"

[review.ultra_high]
model = "gpt-6-astra"
reasoning = "xhigh"
