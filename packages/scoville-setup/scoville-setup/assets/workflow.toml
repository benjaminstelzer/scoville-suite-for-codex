# User-editable native Codex model choices and context thresholds.
schema_version = 1
pin_threads = true

[context]
# Coordinator: at or above; workers: strictly above. Percent of context window.
coordinator_percent = 40
worker_percent = 60

[execute.ultra_low]
model = "gpt-6-sol"
reasoning = "medium"

[review.ultra_low]
model = "gpt-6-sol"
reasoning = "high"

[execute.low]
model = "gpt-6-sol"
reasoning = "high"

[review.low]
model = "gpt-6-sol"
reasoning = "xhigh"

[execute.medium]
model = "gpt-5.6-sol"
reasoning = "medium"

[review.medium]
model = "gpt-5.6-sol"
reasoning = "high"

[execute.high]
model = "gpt-6-astra"
reasoning = "medium"

[review.high]
model = "gpt-6-astra"
reasoning = "high"

[execute.ultra_high]
model = "gpt-6-astra"
reasoning = "high"

[review.ultra_high]
model = "gpt-6-astra"
reasoning = "xhigh"
